<html><head><link rel=stylesheet href=base.css><style>
.s{width:1080px;height:1350px;position:relative;overflow:hidden;background:#fff}
.photo{position:absolute;left:0;top:0;width:100%;height:70%;object-fit:cover;object-position:var(--pos,50% 20%)}
.shade{position:absolute;left:0;top:0;width:100%;height:24%;background:linear-gradient(180deg,rgba(20,18,50,.55),rgba(20,18,50,0))}
.grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 34%,rgba(255,255,255,.93) 50%,#fff 58%)}
.in{position:absolute;inset:0;padding:64px 72px 60px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{height:92px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.35))}
.tag{background:#ea346f;color:#fff;font-weight:700;font-size:21px;letter-spacing:.1em;text-transform:uppercase;padding:13px 24px;border-radius:999px;text-align:center;line-height:1.25}
.bottom{margin-top:auto}
.loc{color:#ea346f;font-weight:700;font-size:28px;letter-spacing:.06em;text-transform:uppercase}
h1{color:#29245c;font-size:80px;line-height:1.02;margin-top:10px}
.eic{display:inline-block;margin-top:22px;background:#29245c;color:#fff;font-weight:700;font-size:26px;padding:13px 26px;border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.chip{background:#f5f4fa;color:#29245c;font-weight:600;font-size:24px;padding:12px 22px;border-radius:999px}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:30px}
.slogan{color:#29245c;font-weight:600;font-size:28px}
.cta{background:#ea346f;color:#fff;font-weight:700;font-size:30px;padding:18px 34px;border-radius:999px}
</style></head><body><div class="s" style="--pos:{{POS}}"><img class="photo" src="photo.jpg"><div class="shade"></div><div class="grad"></div>
<div class="in"><div class="top"><img class="logo" src="logo-blanc.png"><span class="tag">Offre d’emploi<br>pour le Québec</span></div>
<div class="bottom"><div class="loc">{{LIEU}}</div><h1>{{TITRE}}</h1>
<span class="eic">Recrutement sous programme EIC (18-35 ans)</span>
<div class="chips">{{CHIPS}}</div>
<div class="row"><span class="slogan">Votre carrière au Québec</span><span class="cta">Lien du poste en bio</span></div></div></div></div></body></html>
