name: Transcription temporaire
on:
  push:
    branches: [transcribe-tmp]
    paths: ['tmp-transcribe/go']
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: transcribe-tmp }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q faster-whisper
      - run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          import glob,os
          m=WhisperModel('medium',device='cpu',compute_type='int8')
          for f in sorted(glob.glob('tmp-transcribe/*.mp3')):
              segs,_=m.transcribe(f,language='fr',vad_filter=True)
              with open(f[:-4]+'.txt','w') as o:
                  for s in segs: o.write(f"[{s.start:.1f}-{s.end:.1f}] {s.text.strip()}\n")
          PY
        shell: bash
      - run: |
          git config user.name workin-bot; git config user.email workin-bot@users.noreply.github.com
          git add tmp-transcribe/*.txt; git commit -m "transcriptions"; git push
      - if: failure()
        run: |
          git config user.name workin-bot; git config user.email workin-bot@users.noreply.github.com
          echo failed > tmp-transcribe/failed.txt; git add tmp-transcribe; git commit -qm log; git push -q
